name: Windows offline checks

on:
  push:
    branches: [main, Test]
  pull_request:
    branches: [main, Test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Parse Python tooling
        run: python -c "import ast, pathlib; [ast.parse(p.read_bytes(), filename=str(p)) for p in pathlib.Path('tools').rglob('*.py')]"
      - name: Run synthetic dashboard and paper-execution tests
        working-directory: dashboard
        env:
          SIERRA_DATA_FOLDER: ${{ runner.temp }}/empty-sierra-data
        run: npm run test:mnq
      - name: Run synthetic Sierra file-format tests
        run: python -m unittest discover -s tools/sierra -p test_session.py
